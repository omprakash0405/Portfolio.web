<!DOCTYPE html>
<html>
<head>
  <title>Projects | Omprakash</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
  <div class="container nav-container">
    <div class="logo">OmVerse</div>
  </div>
</nav>

<section class="container">
  <h2>Live GitHub Projects</h2>
  <div id="projects" class="grid"></div>
</section>

<footer>© 2026 Omprakash</footer>

<script>
async function loadRepos(){
  const res = await fetch("https://api.github.com/users/omprakash0405/repos");
  const repos = await res.json();
  const container = document.getElementById("projects");

  repos
    .sort((a,b)=> new Date(b.created_at) - new Date(a.created_at))
    .forEach(repo=>{
      if(!repo.fork){
        const card = document.createElement("div");
        card.className="card";
        card.innerHTML=`
          <h3>${repo.name}</h3>
          <p>${repo.description || "No description available"}</p>
          <a href="${repo.html_url}" target="_blank" class="btn">View Repo</a>
        `;
        container.appendChild(card);
      }
    });
}

loadRepos();
</script>

</body>
</html>
